server:
  port: 8080
  environment: development
  read_timeout: 30s
  write_timeout: 30s

database:
  host: localhost
  port: 5433
  user: user
  password: password
  name: brightbund
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  address: localhost:6380
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

logging:
  level: debug
  encoding: console
  output_paths:
    - stdout
  error_output_paths:
    - stderr

jwt:
  secret: your-secret-key-change-in-production
  expiration: 24h
  refresh_expiration: 168h

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8081
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - Idempotency-Key
  expose_headers:
    - Content-Length
  allow_credentials: true
  max_age: 12h

firebase:
  enabled: true
  credentials_path: ./firebase-service-account.json
  project_id: smsbb-6e583

storage:
  endpoint: localhost:9001
  access_key: minioadmin
  secret_key: minioadmin
  bucket: avatars
  use_ssl: false
  public_url: http://localhost:9001

moderation:
  enabled: true
  shadow_mode: true
  min_activation_views: 50
  daily_report_limit: 10
  level1_threshold: 3
  level2_threshold: 5
  level3_threshold: 10
  level4_threshold: 20
  level1_ratio: 0.02
  level2_ratio: 0.05
  level3_ratio: 0.08
  level4_ratio: 0.12

activation:
  enabled: true
  min_restricted_hours: 72
  extended_restricted_hours: 120
  required_distinct_login_days: 3
  required_meaningful_actions: 5
  max_registrations_per_device_day: 3
