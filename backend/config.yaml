app:
  environment: development
  port: "8080"

db:
  host: db
  port: "5432"
  user: user
  password: password
  dbname: brightbund
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  host: redis
  port: "6379"
  password: ""
  db: 0

logger:
  level: debug
  environment: development
  encoding: console
  output_paths:
    - stdout

jwt:
  secret: your-secret-key-change-in-production
  expiration: 24h
  refresh_expiration: 168h

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8081
    - http://localhost:8082
    - exp://*
    - http://*
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - Idempotency-Key
  expose_headers:
    - Content-Length
  allow_credentials: true
  max_age: 12h
