server:
  port: 8080
  environment: development
  read_timeout: 30s
  write_timeout: 30s

database:
  host: db
  port: 5432
  user: user
  password: password
  name: brightbund
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  address: redis:6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

logging:
  level: debug
  encoding: json
  output_paths:
    - stdout
  error_output_paths:
    - stderr

jwt:
  secret: your-dev-jwt-secret-key-change-in-production-123456
  expiration: 15m
  refresh_expiration: 24h

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8081
    - http://localhost:8082
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - Idempotency-Key
  expose_headers:
    - Content-Length
  allow_credentials: true
  max_age: 12h

oauth:
  apple:
    client_id: com.your.bundle.id
    issuer: https://appleid.apple.com
  google:
    client_id: your-google-client-id.apps.googleusercontent.com
    issuer: https://accounts.google.com

firebase:
  enabled: true  # Set to true to enable Firebase SMS
  credentials_path: ./firebase-service-account.json  # Path to Firebase service account JSON
  project_id: smsbb-6e583