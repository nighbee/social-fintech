      user_id:
        type: string
      violation_type:
        $ref: '#/definitions/economy.ViolationType'
    type: object
  economy.ViolationLogsResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      violations:
        items:
          $ref: '#/definitions/economy.ViolationLog'
        type: array
    type: object
  economy.ViolationType:
