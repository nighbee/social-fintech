info:
  contact:
    email: support@brightbund.com
    name: API Support
  description: API for the BrightBund social platform with economy, maps, chat, and
    gamification
  license:
    name: Proprietary
    url: https://brightbund.com/license
  termsOfService: https://brightbund.com/terms
  title: BrightBund API
  version: "1.0"
paths:
  /admin/comments/{comment_id}:
    delete:
      description: Emergency deletion of any comment by an administrator.
      parameters:
      - description: Comment UUID
        in: path
        name: comment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Admin emergency comment deletion
      tags:
      - Feed Moderation
  /admin/posts/{post_id}:
    delete:
      description: Emergency deletion of any post by an administrator.
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Admin emergency post deletion
      tags:
      - Feed Moderation
  /admin/reports:
    get:
      description: Admin endpoint with filters by status/target_type/reason.
      parameters:
      - description: pending/reviewed
        in: query
        name: status
        type: string
      - description: post/comment
        in: query
        name: target_type
        type: string
      - description: report reason
        in: query
        name: reason
        type: string
      - default: 50
        description: limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.ReportsListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List moderation reports
      tags:
      - Feed Moderation
  /admin/reports/review:
    post:
      consumes:
      - application/json
      description: Admin endpoint to apply moderation decision for a target.
      parameters:
      - description: Target and decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/feed.ReviewReportsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Review moderation reports
      tags:
      - Feed Moderation
  /auth/admin/ban:
    post:
      consumes:
      - application/json
      description: Ban a user temporarily or permanently (admin only)
      parameters:
      - description: Ban details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.AdminBanRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - Bearer: []
      summary: 'Admin: Ban user'
      tags:
      - Auth Admin
  /auth/check-email:
    post:
      consumes:
      - application/json
      description: Check if an email is already registered in the system
      parameters:
      - description: Email to check
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CheckEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CheckEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Check if Email Exists
      tags:
      - Auth
  /auth/email/request:
    post:
      consumes:
      - application/json
      description: |-
        Send a 6-digit confirmation code to the supplied email address.
        Purpose drives existence checks:
        register → email must NOT exist
        login | password_reset → email MUST exist
        email_change → no check (used after the user is already authenticated)
      parameters:
      - description: Email and purpose
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.EmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Request Email Verification Code
      tags:
      - Auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verify the 6-digit code returned to the user's inbox during the
        email confirmation step. Returns the verification_id which higher
        level flows (registration, password reset) reference to prove the
        email is owned by the requester.
      parameters:
      - description: Verification ID and email code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.EmailVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Verify Email Code
      tags:
      - Auth
  /auth/firebase-email-login:
    post:
      consumes:
      - application/json
      description: Authenticate user with Firebase ID token from email link verification.
        For existing users.
      parameters:
      - description: Firebase ID token and device info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.FirebaseEmailAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Firebase Email Authentication (Magic Link)
      tags:
      - Auth
  /auth/firebase-email-register:
    post:
      consumes:
      - application/json
      description: Register new user with Firebase ID token (email link) and profile
        information
      parameters:
      - description: Firebase ID token and user profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.FirebaseEmailRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Firebase Email Registration (Magic Link)
      tags:
      - Auth
  /auth/firebase-phone-login:
    post:
      consumes:
      - application/json
      description: Authenticate user with Firebase ID token from phone verification.
        For existing users.
      parameters:
      - description: Firebase ID token and device info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.FirebasePhoneAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
