      tags:
      - Tasks
  /users/search:
    get:
      consumes:
      - application/json
      description: Public search for referrer user selection. Supports nickname (username),
        display name, or first/last name.
      parameters:
      - description: Unified query (nickname/username, display name, or name)
        in: query
        name: query
        type: string
      - description: First name or generic query token
        in: query
        name: first_name
        type: string
      - description: Last name (optional)
        in: query
        name: last_name
        type: string
      - description: Limit (max 50)
