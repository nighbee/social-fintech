      full_title:
        type: string
      icon_url:
        type: string
      level:
        type: string
      level_max_seals:
        type: integer
      level_min_seals:
        type: integer
      next_level:
        type: string
      next_rank:
        type: string
      progress_in_rank:
        type: number
      progress_to_next_level:
        type: number
      quality_name:
        type: string
      rank_max_seals:
        type: integer
      rank_min_seals:
        type: integer
