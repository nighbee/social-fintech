            additionalProperties:
              type: string
            type: object
        "409":
          description: Code already verified
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Submit the 4-digit verification code (helper)
      tags:
      - Tasks
  /tasks/{task_id}/apply:
    post:
