basePath: /api/v1
definitions:
  auth.CheckEmailRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
    type: object
  auth.CheckEmailResponse:
    properties:
      exists:
        example: true
        type: boolean
    type: object
  auth.EmailLoginRequest:
    properties:
      app_version:
        example: 1.0.0
        type: string
      device_id:
        example: device-uuid-12345
        type: string
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        type: string
      user_agent:
        example: BrightBund-iOS/1.0
        type: string
    type: object
  auth.EmailRegisterRequest:
    properties:
      app_version:
        example: 1.0.0
        type: string
      date_of_birth:
