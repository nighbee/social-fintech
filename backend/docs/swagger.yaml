        maxLength: 255
        type: string
      user_id:
        type: string
    required:
    - amount
    - currency
    - reason
    - user_id
    type: object
  economy.BalanceResponse:
    properties:
      gold_balance:
        example: 10
        type: number
      last_accrual_at:
        type: string
      silver_balance:
        example: 4.5
        type: number
      silver_free_balance:
        example: 3
        type: number
    type: object
