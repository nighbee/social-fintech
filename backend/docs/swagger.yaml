      phone_number:
        example: "5551234567"
        type: string
      purpose:
        description: login|register
        example: register
        type: string
    type: object
  auth.PhoneCodeResponse:
    properties:
      expires_at:
        type: string
      verification_id:
        type: string
    type: object
  auth.PhoneRegisterRequest:
    properties:
      app_version:
        type: string
      captcha_token:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referrer_user_id:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  auth.PhoneVerifyRequest:
    properties:
      app_version:
        type: string
      code:
        type: string
      device_id:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  auth.PhoneVerifyResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.User'
      verification_id:
        type: string
      verified:
        type: boolean
    type: object
  auth.ProviderType:
    enum:
    - apple
    - google
    - email
    - phone
    type: string
    x-enum-varnames:
    - ProviderApple
    - ProviderGoogle
    - ProviderEmail
    - ProviderPhone
