basePath: /api/v1
definitions:
  internal_modules_auth.EmailLoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      email:
        type: string
      password:
        type: string
      user_agent:
        type: string
    type: object
  internal_modules_auth.EmailRegisterRequest:
    properties:
      app_version:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      referral:
        type: string
      user_agent:
        type: string
    type: object
  internal_modules_auth.ErrorResponse:
    properties:
      error:
        example: invalid_credentials
        type: string
      message:
        example: Invalid email or password
        type: string
    type: object
  internal_modules_auth.LoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      provider_token:
        type: string
      provider_type:
        $ref: '#/definitions/internal_modules_auth.ProviderType'
      user_agent:
        type: string
    type: object
  internal_modules_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.User'
    type: object
  internal_modules_auth.PhoneCodeRequest:
    properties:
      country_code:
        type: string
      phone_number:
        type: string
      purpose:
        description: login|register
        type: string
    type: object
  internal_modules_auth.PhoneCodeResponse:
    properties:
      expires_at:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneRegisterRequest:
    properties:
      app_version:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referral:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneVerifyRequest:
    properties:
      app_version:
        type: string
      code:
        type: string
      device_id:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneVerifyResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.User'
      verification_id:
        type: string
      verified:
        type: boolean
    type: object
  internal_modules_auth.ProviderType:
    enum:
    - apple
    - google
    - email
    - phone
    type: string
    x-enum-varnames:
    - ProviderApple
    - ProviderGoogle
    - ProviderEmail
    - ProviderPhone
  internal_modules_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_modules_auth.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_shadow_banned:
        type: boolean
      last_active_at:
        type: string
      last_name:
        type: string
      referral_code:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@brightbund.com
    name: API Support
  description: API for the BrightBund social platform with economy, maps, chat, and
    gamification
  license:
    name: Proprietary
    url: https://brightbund.com/license
  termsOfService: https://brightbund.com/terms
  title: BrightBund API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate or register with Apple or Google OAuth. Auto-creates
        user if not exists.
      parameters:
      - description: OAuth login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: OAuth Login (Apple/Google)
      tags:
      - Auth
  /auth/login-email:
    post:
      consumes:
      - application/json
      description: Authenticate existing user with email and password credentials
      parameters:
      - description: Email login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Login with Email and Password
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke current session and invalidate refresh token. Requires auth.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      security:
      - Bearer: []
      summary: Logout Current Session
      tags:
      - Auth
  /auth/phone/request:
    post:
      consumes:
      - application/json
      description: 'Send 6-digit SMS code. Purpose: login (phone must exist) or register
        (phone must not exist)'
      parameters:
      - description: Phone number and purpose
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.PhoneCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Request Phone Verification Code
      tags:
      - Auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Verify SMS code. Returns tokens for login, or verification_id for
        register flow
      parameters:
      - description: Verification ID and SMS code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.PhoneVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Verify Phone Code (Step 2)
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange refresh token for new access and refresh tokens (token
        rotation)
      parameters:
      - description: Refresh token from login/register
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register-email:
    post:
      consumes:
      - application/json
      description: Create a new account with email, password, and personal details.
        Password min 8 chars.
      parameters:
      - description: Complete registration information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.EmailRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Register with Email and Password
      tags:
      - Auth
  /auth/register-phone:
    post:
      consumes:
      - application/json
      description: Complete registration with profile info after phone verification
      parameters:
      - description: Profile info and verification ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth.ErrorResponse'
      summary: Complete Phone Registration (Step 3)
      tags:
      - Auth
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
