  /map/champions:
    get:
      description: |-
        Returns the current champion for each of the supplied H3 cell indices
        at the given resolution and ISO week. Used by the Flutter map to render
        champion pins on the visible viewport.
        Privacy: exact user GPS is never exposed; pins use the H3 region center only.
      parameters:
      - description: Comma-separated H3 cell IDs (e.g. 852830803fffffff,852830813fffffff)
        in: query
        name: h3
        required: true
        type: string
      - default: 5
        description: H3 resolution (2=country, 4=city, 5=district)
        in: query
        name: resolution
        type: integer
      - description: Year (defaults to current)
        in: query
        name: year
        type: integer
      - description: ISO week number (defaults to current)
        in: query
        name: week
        type: integer
