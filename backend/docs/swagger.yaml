basePath: /api/v1
definitions:
  auth.AdminBanRequest:
    properties:
      ban_type:
        allOf:
        - $ref: '#/definitions/auth.BanType'
        enum:
        - temporary
        - permanent
      duration:
        description: e.g. "24h", "7d". Required if BanType is temporary
        type: string
      reason:
        type: string
      user_id:
        type: string
    required:
    - ban_type
    - reason
    - user_id
    type: object
  auth.BanType:
    enum:
    - temporary
    - permanent
    type: string
    x-enum-varnames:
    - BanTypeTemporary
    - BanTypePermanent
  auth.CheckEmailRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
    type: object
  auth.CheckEmailResponse:
    properties:
      exists:
        example: true
        type: boolean
    type: object
  auth.EmailCodeRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      purpose:
        example: register
        type: string
    type: object
  auth.EmailCodeResponse:
    properties:
      expires_at:
        type: string
      verification_id:
        type: string
    type: object
  auth.EmailLoginRequest:
    properties:
      app_version:
        example: 1.0.0
        type: string
      device_id:
        example: device-uuid-12345
        type: string
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        type: string
      user_agent:
        example: BrightBund-iOS/1.0
        type: string
    type: object
  auth.EmailRegisterRequest:
    properties:
      app_version:
        example: 1.0.0
        type: string
      captcha_token:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        example: "2000-01-01"
        type: string
      device_id:
        example: device-uuid-12345
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: SecurePass123!
        type: string
      referrer_user_id:
        example: FRIEND123
        type: string
      user_agent:
        example: BrightBund-iOS/1.0
        type: string
