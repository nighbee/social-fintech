swagger: "2.0"
info:
  title: BrightBund API
  description: |
    Complete API specification for the BrightBund social platform with economy, maps, chat, and gamification.

    ## Authentication
    Most endpoints require authentication via Bearer token in the `Authorization` header.
    Format: `Authorization: Bearer <access_token>`

    ## Rate Limiting
    API endpoints are rate-limited to prevent abuse. Limits vary by endpoint.

    ## Error Codes
    - `402 Payment Required`: Insufficient funds (triggers frontend "Quiet Shop" animation)
    - `429 Too Many Requests`: Rate limit exceeded
    - `401 Unauthorized`: Invalid or expired token
  version: "1.0"
  contact:
    email: support@brightbund.com
    name: API Support
  license:
    name: Proprietary
    url: https://brightbund.com/license
  termsOfService: https://brightbund.com/terms

host: localhost:8081
basePath: /api/v1
schemes:
  - https
  - http

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: 'JWT Authorization header using the Bearer scheme. Format: "Bearer {token}"'

tags:
  - name: Auth
    description: Authentication and session management
  - name: Profile
    description: User profiles and statistics
  - name: Feed
    description: Content feed and interactions
  - name: Economy
    description: Wallet, ledger, and currency transactions
  - name: Map
    description: Geospatial tasks and discovery
  - name: Gamification
    description: Ranks, seasons, and progression
  - name: Leaderboard
    description: Global and regional rankings
  - name: Chat
    description: Real-time messaging
  - name: Notifications
    description: Push and in-app notifications
  - name: Payment
    description: In-app purchases and monetization
  - name: Social
    description: Allies, followers, and social graph
  - name: System
    description: Health checks and configuration

# ============================================================================
# PATHS - ORGANIZED BY EPIC
# ============================================================================

paths:
  # ============================================================================
  # EPIC 1 - AUTHENTICATION & ACCOUNTS
  # ============================================================================

  /auth/register/phone/init:
    post:
      tags:
        - Auth
      summary: Initialize phone registration
      description: Send OTP to phone number for registration
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - phone
              - country_code
            properties:
              phone:
                type: string
                example: "+77001234567"
                description: Full phone number with country code
              country_code:
                type: string
                example: "KZ"
                description: ISO 3166-1 alpha-2 country code
      responses:
        200:
          description: OTP sent successfully
          schema:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
              expires_at:
                type: string
                format: date-time
              retry_after:
                type: integer
                description: Seconds until next OTP request allowed
        400:
          description: Invalid phone number or country code
          schema:
            $ref: "#/definitions/ErrorResponse"
        429:
          description: Too many OTP requests
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/register/phone/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP for phone registration
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - session_id
              - otp_code
            properties:
              session_id:
                type: string
                format: uuid
              otp_code:
                type: string
                example: "1234"
                minLength: 4
                maxLength: 6
      responses:
        200:
          description: OTP verified, temporary token issued
          schema:
            type: object
            properties:
              verified:
                type: boolean
              temp_token:
                type: string
                description: Temporary JWT for completing registration
              expires_in:
                type: integer
                description: Token validity in seconds
        400:
          description: Invalid OTP or session
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/register/phone/complete:
    post:
      tags:
        - Auth
      summary: Complete phone registration
      description: Finish registration by providing user details
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - temp_token
              - first_name
              - last_name
              - date_of_birth
              - username
            properties:
              temp_token:
                type: string
              first_name:
                type: string
                minLength: 2
                maxLength: 50
              last_name:
                type: string
                minLength: 2
                maxLength: 50
              username:
                type: string
                minLength: 3
                maxLength: 30
                pattern: "^[a-zA-Z0-9_]+$"
              date_of_birth:
                type: string
                format: date
                example: "1995-01-01"
              referral_username:
                type: string
                description: Optional referral code
      responses:
        201:
          description: Registration completed
          schema:
            $ref: "#/definitions/AuthResponse"
        400:
          description: Invalid input or username taken
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/register/email:
    post:
      tags:
        - Auth
      summary: Register with email
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - password_confirm
              - first_name
              - last_name
              - username
              - date_of_birth
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 8
                maxLength: 128
              password_confirm:
                type: string
              first_name:
                type: string
              last_name:
                type: string
              username:
                type: string
                pattern: "^[a-zA-Z0-9_]+$"
              date_of_birth:
                type: string
                format: date
              referral_username:
                type: string
      responses:
        201:
          description: Registration successful
          schema:
            $ref: "#/definitions/AuthResponse"
        400:
          description: Validation error or email already exists
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/register/oauth/apple:
    post:
      tags:
        - Auth
      summary: Register/Login via Apple OAuth
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - id_token
              - device_id
            properties:
              id_token:
                type: string
                description: Apple ID token
              authorization_code:
                type: string
                description: Apple authorization code
              device_id:
                type: string
                format: uuid
              referral_username:
                type: string
      responses:
        200:
          description: Login/Registration successful
          schema:
            allOf:
              - $ref: "#/definitions/AuthResponse"
              - type: object
                properties:
                  is_new_user:
                    type: boolean
        400:
          description: Invalid token
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/register/oauth/google:
    post:
      tags:
        - Auth
      summary: Register/Login via Google OAuth
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - id_token
              - device_id
            properties:
              id_token:
                type: string
                description: Google ID token
              device_id:
                type: string
                format: uuid
              referral_username:
                type: string
      responses:
        200:
          description: Login/Registration successful
          schema:
            allOf:
              - $ref: "#/definitions/AuthResponse"
              - type: object
                properties:
                  is_new_user:
                    type: boolean

  /auth/login/phone/init:
    post:
      tags:
        - Auth
      summary: Initialize phone login
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - phone
              - country_code
            properties:
              phone:
                type: string
              country_code:
                type: string
      responses:
        200:
          description: OTP sent
          schema:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
              expires_at:
                type: string
                format: date-time

  /auth/login/phone/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP and login
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - session_id
              - otp_code
              - device_id
            properties:
              session_id:
                type: string
                format: uuid
              otp_code:
                type: string
              device_id:
                type: string
                format: uuid
              device_info:
                $ref: "#/definitions/DeviceInfo"
      responses:
        200:
          description: Login successful
          schema:
            $ref: "#/definitions/AuthResponse"

  /auth/login/email:
    post:
      tags:
        - Auth
      summary: Login with email/password
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - device_id
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              device_id:
                type: string
                format: uuid
              device_info:
                $ref: "#/definitions/DeviceInfo"
      responses:
        200:
          description: Login successful
          schema:
            $ref: "#/definitions/AuthResponse"
        401:
          description: Invalid credentials
          schema:
            $ref: "#/definitions/ErrorResponse"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - refresh_token
            properties:
              refresh_token:
                type: string
      responses:
        200:
          description: Token refreshed
          schema:
            type: object
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
              expires_in:
                type: integer

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and invalidate session
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          schema:
            type: object
            properties:
              refresh_token:
                type: string
      responses:
        200:
          description: Logged out successfully
          schema:
            type: object
            properties:
              success:
                type: boolean

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user session
      security:
        - Bearer: []
      produces:
        - application/json
      responses:
        200:
          description: Current user info
          schema:
            $ref: "#/definitions/User"

  # ============================================================================
  # EPIC 2 - PROFILES
  # ============================================================================

  /profiles/{user_id}:
    get:
      tags:
        - Profile
      summary: Get user profile
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: user_id
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: User profile
          schema:
            $ref: "#/definitions/ProfileResponse"
        404:
          description: User not found
          schema:
            $ref: "#/definitions/ErrorResponse"

  /profiles/me:
    get:
      tags:
        - Profile
      summary: Get own profile
      security:
        - Bearer: []
      produces:
        - application/json
      responses:
        200:
          description: Own profile
          schema:
            $ref: "#/definitions/ProfileResponse"

    patch:
      tags:
        - Profile
      summary: Update own profile
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          schema:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
              bio:
                type: string
                maxLength: 500
              region:
                type: string
      responses:
        200:
          description: Profile updated
          schema:
            $ref: "#/definitions/ProfileResponse"

  /profiles/me/avatar:
    post:
      tags:
        - Profile
      summary: Upload avatar image
      security:
        - Bearer: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - in: formData
          name: file
          type: file
          required: true
          description: Avatar image (max 5MB, jpg/png)
      responses:
        200:
          description: Avatar uploaded
          schema:
            type: object
            properties:
              avatar_url:
                type: string
                format: uri

  /profiles/{user_id}/stats:
    get:
      tags:
        - Profile
      summary: Get user statistics
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: user_id
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: User stats
          schema:
            $ref: "#/definitions/ProfileStats"

  # ============================================================================
  # EPIC 3 - FEED & INTERACTIONS
  # ============================================================================

  /feed:
    get:
      tags:
        - Feed
      summary: Get mixed feed (allies + local + world)
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: query
          name: cursor
          type: string
          description: Pagination cursor
        - in: query
          name: limit
          type: integer
          default: 20
          maximum: 50
      responses:
        200:
          description: Feed data
          schema:
            $ref: "#/definitions/FeedResponse"

  /feed/allies:
    get:
      tags:
        - Feed
      summary: Get allies-only feed
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: query
          name: cursor
          type: string
        - in: query
          name: limit
          type: integer
          default: 20
      responses:
        200:
          description: Allies feed
          schema:
            $ref: "#/definitions/FeedResponse"

  /feed/local:
    get:
      tags:
        - Feed
      summary: Get local geo-based feed
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: query
          name: cursor
          type: string
        - in: query
          name: limit
          type: integer
          default: 20
        - in: query
          name: lat
          type: number
          format: double
          required: true
        - in: query
          name: lng
          type: number
          format: double
          required: true
        - in: query
          name: radius_km
          type: number
          default: 5
      responses:
        200:
          description: Local feed
          schema:
            $ref: "#/definitions/FeedResponse"

  /feed/world:
    get:
      tags:
        - Feed
      summary: Get random world feed
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: query
          name: cursor
          type: string
        - in: query
          name: limit
          type: integer
          default: 20
      responses:
        200:
          description: World feed
          schema:
            $ref: "#/definitions/FeedResponse"

  /posts:
    post:
      tags:
        - Feed
      summary: Create new post
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 2000
              media_urls:
                type: array
                items:
                  type: string
                  format: uri
                maxItems: 5
              location:
                $ref: "#/definitions/Location"
      responses:
        201:
          description: Post created
          schema:
            $ref: "#/definitions/Post"
        400:
          description: Invalid input
          schema:
            $ref: "#/definitions/ErrorResponse"

  /posts/upload-media:
    post:
      tags:
        - Feed
      summary: Upload media for post
      security:
        - Bearer: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - in: formData
          name: files
          type: file
          required: true
          description: Media files (max 5 files, 10MB each)
      responses:
        200:
          description: Media uploaded
          schema:
            type: object
            properties:
              media_urls:
                type: array
                items:
                  type: string
                  format: uri

  /posts/{post_id}:
    get:
      tags:
        - Feed
      summary: Get single post
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Post details
          schema:
            $ref: "#/definitions/Post"

    delete:
      tags:
        - Feed
      summary: Delete own post
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Post deleted
          schema:
            type: object
            properties:
              success:
                type: boolean

  /posts/{post_id}/comments:
    get:
      tags:
        - Feed
      summary: Get comments for post
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
        - in: query
          name: cursor
          type: string
        - in: query
          name: limit
          type: integer
          default: 50
      responses:
        200:
          description: Comments list
          schema:
            type: object
            properties:
              comments:
                type: array
                items:
                  $ref: "#/definitions/Comment"
              next_cursor:
                type: string

    post:
      tags:
        - Feed
      summary: Create comment
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 1000
              parent_comment_id:
                type: string
                format: uuid
      responses:
        201:
          description: Comment created
          schema:
            $ref: "#/definitions/Comment"

  /comments/{comment_id}:
    delete:
      tags:
        - Feed
      summary: Delete own comment
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: comment_id
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Comment deleted
          schema:
            type: object
            properties:
              success:
                type: boolean

  /posts/{post_id}/give-seal:
    post:
      tags:
        - Feed
      summary: Give Silver Seal to post
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - amount
            properties:
              amount:
                type: integer
                minimum: 1
                maximum: 10
      responses:
        200:
          description: Seal given successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
              new_balance:
                type: integer
              transaction_id:
                type: string
                format: uuid
        402:
          description: Insufficient funds - triggers "Quiet Shop" animation
          schema:
            type: object
            properties:
              error:
                type: string
                example: "INSUFFICIENT_FUNDS"
              required:
                type: integer
              available:
                type: integer

  /users/{user_id}/give-seal:
    post:
      tags:
        - Feed
      summary: Give Silver Seal directly to user
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: user_id
          required: true
          type: string
          format: uuid
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - amount
            properties:
              amount:
                type: integer
                minimum: 1
              message:
                type: string
                maxLength: 200
      responses:
        200:
          description: Seal transferred
          schema:
            type: object
            properties:
              success:
                type: boolean
              new_balance:
                type: integer
              transaction_id:
                type: string
                format: uuid
        402:
          description: Insufficient funds
          schema:
            $ref: "#/definitions/InsufficientFundsError"

  /posts/{post_id}/seal-givers:
    get:
      tags:
        - Feed
      summary: Get users who gave seals to post
      security:
        - Bearer: []
      produces:
        - application/json
      parameters:
        - in: path
          name: post_id
          required: true
          type: string
          format: uuid
        - in: query
          name: limit
          type: integer
          default: 50
      responses:
        200:
          description: Seal givers list
          schema:
            type: object
            properties:
              givers:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    avatar_url:
                      type: string
                    amount:
                      type: integer
                    given_at:
                      type: string
                      format: date-time

  /feed/session/start:
    post:
      tags:
        - Feed
      summary: Mark feed session start (anti-doomscroll)
      security:
        - Bearer: []
      produces:
        - application/json
      responses:
        200:
          description: Session started
          schema:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
              started_at:
                type: string
                format: date-time

  /feed/session/heartbeat:
    post:
      tags:
        - Feed
      summary: Update session activity
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - session_id
            properties:
              session_id:
                type: string
                format: uuid
      responses:
        200:
          description: Session updated
          schema:
            type: object
            properties:
              session_duration_mins:
                type: integer
              feed_degraded:
                type: boolean
                description: True if session > 20 mins

  /feed/session/end:
    post:
      tags:
        - Feed
      summary: End feed session
      security:
        - Bearer: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            required:
              - session_id
            properties:
              session_id:
                type: string
                format: uuid
      responses:
        200:
          description: Session ended
          schema:
            type: object
            properties:
              total_duration_mins:
                type: integer
              posts_viewed:
                type: integer

  # ============================================================================
  # EPIC 4 - ECONOMY & SEALS
  # ============================================================================

  /economy/balance:
    get:
      tags:
        - Economy
