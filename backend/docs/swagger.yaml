      min_seals:
        type: integer
      name:
        type: string
      order:
        type: integer
      quality:
        type: string
      sub_levels:
        items:
          $ref: '#/definitions/ranks.SubLevelInfo'
        type: array
    type: object
  ranks.SubLevelInfo:
    properties:
      level:
        type: string
      max_seals:
        type: integer
      min_seals:
        type: integer
