        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      receiver_balance:
        example: 6.5
        type: number
      sender_balance:
        example: 3.5
        type: number
      timestamp:
        type: string
    type: object
  economy.UserInfo:
