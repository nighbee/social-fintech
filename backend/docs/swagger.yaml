  auth.EmailVerifyRequest:
    properties:
      code:
        type: string
      verification_id:
        type: string
    type: object
  auth.EmailVerifyResponse:
    properties:
      verification_id:
        type: string
      verified:
        type: boolean
    type: object
  auth.ErrorResponse:
    properties:
      error:
        example: invalid_credentials
        type: string
      message:
        example: Invalid email or password
        type: string
