basePath: /api/v1
definitions:
  fiber.Map:
    additionalProperties: true
    type: object
  internal_modules_auth.EmailLoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      email:
        type: string
      password:
        type: string
      user_agent:
        type: string
    type: object
  internal_modules_auth.EmailRegisterRequest:
    properties:
      app_version:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      referral:
        type: string
      user_agent:
        type: string
    type: object
  internal_modules_auth.LoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      provider_token:
        type: string
      provider_type:
        $ref: '#/definitions/internal_modules_auth.ProviderType'
      user_agent:
        type: string
    type: object
  internal_modules_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.User'
    type: object
  internal_modules_auth.PhoneCodeRequest:
    properties:
      country_code:
        type: string
      phone_number:
        type: string
      purpose:
        description: login|register
        type: string
    type: object
  internal_modules_auth.PhoneCodeResponse:
    properties:
      expires_at:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneRegisterRequest:
    properties:
      app_version:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referral:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneVerifyRequest:
    properties:
      app_version:
        type: string
      code:
        type: string
      device_id:
        type: string
      user_agent:
        type: string
      verification_id:
        type: string
    type: object
  internal_modules_auth.PhoneVerifyResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.User'
      verification_id:
        type: string
      verified:
        type: boolean
    type: object
  internal_modules_auth.ProviderType:
    enum:
    - apple
    - google
    - email
    - phone
    type: string
    x-enum-varnames:
    - ProviderApple
    - ProviderGoogle
    - ProviderEmail
    - ProviderPhone
  internal_modules_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_modules_auth.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_shadow_banned:
        type: boolean
      last_active_at:
        type: string
      last_name:
        type: string
      referral_code:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@brightbund.com
    name: API Support
  description: API for the BrightBund social platform with economy, maps, chat, and
    gamification
  license:
    name: Proprietary
    url: https://brightbund.com/license
  termsOfService: https://brightbund.com/terms
  title: BrightBund API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with Apple or Google OAuth token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Login or register with OAuth provider
      tags:
      - Auth
  /auth/login-email:
    post:
      consumes:
      - application/json
      description: Authenticate using email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Login with email and password
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the current session and refresh token
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - Bearer: []
      summary: Logout
      tags:
      - Auth
  /auth/phone/request:
    post:
      consumes:
      - application/json
      description: Send SMS verification code to phone number for login or registration
      parameters:
      - description: Phone code request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.PhoneCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: User not found (login purpose)
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Phone already exists (register purpose)
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Request phone verification code
      tags:
      - Auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Verify the SMS code and complete phone login
      parameters:
      - description: Phone verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.PhoneVerifyResponse'
        "400":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Verify phone code
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register-email:
    post:
      consumes:
      - application/json
      description: Create a new account with email, password, and personal details
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.EmailRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Email already exists
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Register with email and password
      tags:
      - Auth
  /auth/register-phone:
    post:
      consumes:
      - application/json
      description: Complete registration after phone verification with personal details
      parameters:
      - description: Phone registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.PhoneRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Complete phone registration
      tags:
      - Auth
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
