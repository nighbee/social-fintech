        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get champions for H3 cells
      tags:
      - Map
  /map/h3/{h3_index}/admin:
    get:
      description: |-
        Returns the city, region, and country for a given H3 cell index.
        This endpoint performs a spatial lookup against the administrative_boundaries table
        using the H3 cell's center point. Result is cached in h3_geo_metadata for repeated lookups.
        Privacy: only region-level metadata is returned; no exact user location is ever exposed.
      parameters:
