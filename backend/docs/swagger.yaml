host: localhost:8081
info:
  contact:
    email: support@brightbund.com
    name: API Support
  description: API for the BrightBund social platform with economy, maps, chat, and
    gamification
  license:
    name: Proprietary
    url: https://brightbund.com/license
  termsOfService: https://brightbund.com/terms
  title: BrightBund API
  version: "1.0"
paths:
  /api/v1/feed:
    get:
      description: Fetch mixed feed (Allies + Local Geo + World)
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - default: 20
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.FeedResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get mixed feed
      tags:
      - Feed
  /api/v1/feed/state:
    get:
      description: 'Returns accumulated active seconds, cooldown status, and break_seconds_remaining
        (0-300). Applies the hard break/reset state machine: if a 5-min break has
        expired the state is fully reset; if the user was away ≥ 5 min during an active
        phase the timer resets to 0.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.FeedStateResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Fetch current feed fatigue state
      tags:
      - Feed
  /api/v1/feed/state/sync:
    post:
      consumes:
      - application/json
      description: Pings the server with DeltaSeconds. Evaluated by anti-cheat engine.
      parameters:
      - description: Sync payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/feed.SyncFeedStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.FeedStateResponse'
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Sync active feed time
      tags:
      - Feed
  /api/v1/posts:
    post:
      consumes:
      - application/json
      description: Create a post containing text, media attachments, and privacy controls
      parameters:
      - description: Post creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/feed.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a new feed post
      tags:
      - Feed
  /api/v1/posts/{post_id}/comments:
    get:
      description: Fetch threaded comments for a specific post. Pass parent_id to
        get replies for a specific comment.
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      - description: Optional comment UUID to fetch replies for
        in: query
        name: parent_id
        type: string
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - default: 50
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.ThreadedCommentsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get post comments
      tags:
      - Feed
    post:
      consumes:
      - application/json
      description: Comment or reply on a specific post
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      - description: Comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/feed.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Commenting disabled or restricted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Comment on a post
      tags:
      - Feed
  /api/v1/posts/{post_id}/likes:
    get:
      description: Fetch paginated list of users who liked the post
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.InteractionListResponse'
      summary: Fetch post likes
      tags:
      - Feed Interactions
    post:
      description: Queues a like interaction through the Redis write-behind worker
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted for processing
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Like a post
      tags:
      - Feed Interactions
  /api/v1/posts/{post_id}/seals:
    get:
      description: Fetch all users who contributed Silver Seals and their messages
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feed.SealListResponse'
      summary: Fetch post seals
      tags:
      - Feed Interactions
    post:
      consumes:
      - application/json
      description: Deducts silver from the viewer and credits the post author. Validates
        balance, cooldown, and self-seal rules via the Economy module.
      parameters:
      - description: Post UUID
        in: path
        name: post_id
        required: true
        type: string
      - description: Seal Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/feed.SendSealRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Seal sent — returns ledger_entry_id and new sender balance
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "402":
          description: insufficient_balance
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: cooldown active
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Give Silver Seal to post (Economy)
      tags:
      - Feed Interactions
  /auth/check-email:
    post:
      consumes:
      - application/json
      description: Check if an email is already registered in the system
      parameters:
      - description: Email to check
