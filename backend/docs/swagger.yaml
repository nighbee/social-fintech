        - SILVER_SEAL
        - GOLD_SEAL
        type: string
      idempotency_key:
        type: string
      receiver_user_id:
        type: string
    required:
    - amount
    - currency
    - receiver_user_id
    type: object
  economy.GiveSealToUserRequest:
    properties:
      amount:
        type: number
      currency:
        enum:
        - SILVER_SEAL
        - GOLD_SEAL
        type: string
      idempotency_key:
        type: string
      message:
        maxLength: 200
        minLength: 10
        type: string
    required:
    - amount
    - currency
    - message
    type: object
  economy.LimitsResponse:
