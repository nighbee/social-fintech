        - System
      summary: API version information
      produces:
        - application/json
      responses:
        200:
          description: Version info
          schema:
            type: object
            properties:
              version:
                type: string
                example: "1.0.0"
              build:
                type: string
              environment:
                type: string
                enum: [production, staging, development]

  /config:
    get:
      tags:
        - System
      summary: Get app configuration
      security:
        - Bearer: []
      produces:
        - application/json
      responses:
        200:
          description: App config
          schema:
            type: object
            properties:
              features:
                type: object
                properties:
                  chat_enabled:
                    type: boolean
                  tasks_enabled:
                    type: boolean
              limits:
                type: object
                properties:
                  max_seals_per_post:
                    type: integer
                  max_media_per_post:
                    type: integer
              maintenance_mode:
                type: boolean

# ============================================================================
# DEFINITIONS - DATA MODELS
# ============================================================================

definitions:
  ErrorResponse:
