        example: "2000-01-01"
        type: string
      device_id:
        example: device-uuid-12345
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: SecurePass123!
        type: string
      referrer_user_id:
        example: FRIEND123
