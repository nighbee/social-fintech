    - SILVER_SEAL
    - GOLD_SEAL
    type: string
    x-enum-varnames:
    - CurrencySilverSeal
    - CurrencyGoldSeal
  economy.ErrorResponse:
    properties:
      code:
        example: INSUFFICIENT_FUNDS
        type: string
      error:
        example: INSUFFICIENT_FUNDS
        type: string
      message:
        example: You don't have enough Seals
        type: string
    type: object
  economy.GiveSealToPostRequest:
    properties:
      amount:
