    properties:
      app_version:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      firebase_id_token:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referrer_user_id:
        type: string
      user_agent:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
