        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Firebase Phone Authentication
      tags:
      - Auth
  /auth/firebase-phone-register:
    post:
      consumes:
      - application/json
      description: Register new user with Firebase ID token and profile information
      parameters:
      - description: Firebase ID token and user profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.FirebasePhoneRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Firebase Phone Registration
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate or register with Apple or Google OAuth. Auto-creates
        user if not exists.
      parameters:
      - description: OAuth login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: OAuth Login (Apple/Google)
      tags:
      - Auth
  /auth/login-email:
    post:
      consumes:
      - application/json
      description: Authenticate existing user with email and password credentials
      parameters:
      - description: Email login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login with Email and Password
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke current session and invalidate refresh token. Requires auth.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - Bearer: []
      summary: Logout Current Session
      tags:
      - Auth
  /auth/phone/request:
    post:
      consumes:
      - application/json
      description: 'Send 4-digit SMS code. Purpose: login (phone must exist) or register
        (phone must not exist)'
      parameters:
      - description: Phone number and purpose
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.PhoneCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PhoneCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Request Phone Verification Code
      tags:
      - Auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Verify SMS code. Returns tokens for login, or verification_id for
        register flow
      parameters:
      - description: Verification ID and SMS code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.PhoneVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PhoneVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
