  auth.FirebaseEmailAuthRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      firebase_id_token:
        type: string
      user_agent:
        type: string
    type: object
  auth.FirebaseEmailRegisterRequest:
    properties:
      app_version:
        type: string
      captcha_token:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      firebase_id_token:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referrer_user_id:
        type: string
      user_agent:
        type: string
    type: object
  auth.FirebasePhoneAuthRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      firebase_id_token:
        type: string
      user_agent:
        type: string
    type: object
  auth.FirebasePhoneRegisterRequest:
    properties:
      app_version:
        type: string
      captcha_token:
        type: string
      date_of_birth:
        description: YYYY-MM-DD
        type: string
      device_id:
        type: string
      firebase_id_token:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      referrer_user_id:
        type: string
      user_agent:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      app_version:
        type: string
      device_id:
        type: string
      provider_token:
        type: string
      provider_type:
