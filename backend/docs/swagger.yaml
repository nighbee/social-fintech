      created_at:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      h3_res2:
        type: string
      h3_res4:
        type: string
      h3_res5:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      is_shadow_banned:
        type: boolean
      last_active_at:
        type: string
      last_name:
        type: string
      location_opt_in:
        type: boolean
      location_updated_at:
        type: string
      participate_district:
