  /tasks:
    post:
      consumes:
      - application/json
      description: |-
        Creates a task at the given coordinates. Charges 1–3 Silver Seals upfront.
        The response includes `verification_code` which is shown ONLY to the creator
        and must be shared with helpers out-of-band (via chat) to verify completion.
        A 7-day cooldown applies between task creations per user.
      parameters:
      - description: Task creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mapmodule.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mapmodule.CreateTaskResponse'
        "400":
          description: Validation error (invalid_title | invalid_reward | invalid_workers
            | invalid_coordinates)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "402":
          description: Insufficient Silver Seals
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Cooldown active — must wait 7 days
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a map task
      tags:
      - Tasks
  /tasks/{task_id}:
    delete:
      description: |-
        Cancels an open task and refunds the Silver Seal charge to the creator.
        Only allowed while no worker has been confirmed yet (workers_filled == 0).
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mapmodule.CancelTaskResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not the task creator
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Task already completed or cancelled, or has active workers
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Cancel a task (creator only)
      tags:
      - Tasks
    get:
      description: Returns the details of a single task.
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mapmodule.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get task details
      tags:
      - Tasks
