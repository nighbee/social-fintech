services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: brightbund-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brightbund
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d brightbund"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brightbund-network

  redis:
    image: redis:7-alpine
    container_name: brightbund-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brightbund-network

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: brightbund-api
    ports:
      - "8081:8080"
    volumes:
      - ../backend:/app
    environment:
      - CONFIG_PATH=/app/config.yaml
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=brightbund
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brightbund-network
    command: air -c .air.toml

volumes:
  postgres_data:
  redis_data:

networks:
  brightbund-network:
    driver: bridge
