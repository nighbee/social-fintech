user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on; 
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 500M;
    client_body_timeout 300s;

    # Основной и единственный серверный блок
    server {
        # default_server гарантирует, что запросы от Cloudflare попадут именно сюда
        listen 80 default_server;
        server_name brightbund.app www.brightbund.app 35.209.210.231;

        # Проверка здоровья Nginx (для диагностики)
        location /health {
            return 200 '{"status":"ok","source":"nginx"}';
            add_header Content-Type application/json;
        }

        # API Reverse Proxy
        location /api/v1/ {
            proxy_pass http://brightbund-api:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Swagger Docs
        location /swagger/ {
            proxy_pass http://brightbund-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO Storage Proxy
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Защита от запрещенных методов и сканеров
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|PATCH)$ ) {
            return 444;
        }

        location ~* \.(php|aspx|env|bak|git)$ {
            return 444;
            access_log off;
        }

        # Account Deletion Page (Google Play Requirement)
        location = /account-deletion {
            alias /usr/share/nginx/html/account-deletion.html;
            add_header Content-Type text/html;
            access_log off;
        }

        # Фоллбэк для всех остальных путей
        location / {
            return 404 '{"error":"Not Found","message":"Try /api/v1/ or /swagger/ or /account-deletion"}';
            add_header Content-Type application/json;
        }
    }
}