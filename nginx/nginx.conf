user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version

    client_max_body_size 100M;

    # 1. Default server block to drop all unknown host traffic
    # This prevents bots from reaching your app using random domain names or just the IP
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Special Nginx code to close connection without response
        access_log off;
    }

    # 2. Main application server block
    server {
        listen 80;
        # CHANGE: Add your domain name here alongside the IP
        server_name 139.59.194.126 68.183.186.224 localhost;

        # 3. Restrict HTTP Methods
        # Blocks the strange methods like 'NKBBG' seen in your logs
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|PATCH)$ ) {
            return 444;
        }
        
        # Block malicious scans (php, aspx, etc.)
        location ~* \.(php|aspx|jsp|env|bak|config|sql|cgi|log|ini|rar|zip|7z|tar|gz|bz2)$ {
            return 444; 
            access_log off; 
        }

        # Block common bot probes (WordPress, .git, etc.)
        location ~* /(wp-admin|wp-content|wp-includes|\.git|\.env|backup|old|new|shell|cmd|eval|xmlrpc|boaform|cgi-bin|debug|web-console|admin|setup|config) {
            return 444;
            access_log off;
        }

        # API Reverse Proxy
        location /api/v1/ {
            proxy_pass http://api:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Docs
        location /swagger/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO Storage Proxy
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck for Nginx itself
        location /health {
            return 200 '{"status":"ok","source":"nginx"}';
            add_header Content-Type application/json;
        }

        # 4. Handle root cleanly to prevent 404/filesystem scans
        location / {
            return 404 '{"error":"Not Found","message":"Try /api/v1/ or /swagger/"}';
            add_header Content-Type application/json;
        }
    }
}
